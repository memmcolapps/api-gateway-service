name: Deploy Spring Boot to Server

on:
  push:
    branches:
      - staging
      - main
      - alfuttaim

jobs:
  deploy-linux:
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    concurrency:
      group: apigateway-deploy-${{ github.ref }}
      cancel-in-progress: false

    steps:
      # =====================
      # Checkout
      # =====================
      - name: Checkout code
        uses: actions/checkout@v4

      # =====================
      # Java Setup
      # =====================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # =====================
      # Build
      # =====================
      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw package -DskipTests

      # =====================
      # Resolve JAR
      # =====================
      - name: Resolve JAR
        run: |
          JAR_FILE=$(find target -name "*.jar" ! -name "*original*.jar" | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "No JAR found"
            exit 1
          fi

          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_ENV
          echo "Found: $JAR_FILE"

      # =====================================================
      # SSH SETUP (STAGING)
      # =====================================================
      - name: Setup SSH (Staging)
        if: github.ref == 'refs/heads/staging'
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      # =====================
      # SSH Setup - Production
      # =====================
      - name: Setup SSH (Production)
        if: github.ref == 'refs/heads/main'
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      # =====================
      # Deploy API Gateway
      # =====================
      - name: Deploy API Gateway
        shell: bash
        env:
          SERVER_USER: ${{ github.ref == 'refs/heads/staging' && secrets.STAGING_SERVER_USER || secrets.PROD_SERVER_USER }}
          SERVER_HOST: ${{ github.ref == 'refs/heads/staging' && secrets.STAGING_SERVER_HOST || secrets.PROD_SERVER_HOST }}
          SSH_PORT: ${{ github.ref == 'refs/heads/staging' && secrets.STAGING_SERVER_SSH_PORT || secrets.PROD_SERVER_SSH_PORT || '22' }}

          LOCATION: ${{ secrets.LOCATION }}
          EUREKA_ADDRESS: ${{ secrets.EUREKA_ADDRESS }}
          EUREKA_PORT: ${{ secrets.EUREKA_PORT }}
          ENV_FILE: ${{ secrets.ENV_FILE }}

          KEYSTORE_ALIAS: ${{ github.ref == 'refs/heads/staging' && secrets.KEYSTORE_ALIAS || secrets.PROD_KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_TYPE: ${{ secrets.KEYSTORE_TYPE }}

          APP_PROFILE: ${{ github.ref == 'refs/heads/staging' && 'staging' || 'prod' }}

        run: |
          set -euo pipefail
          
          : "${SERVER_USER:?Missing server user}"
          : "${SERVER_HOST:?Missing server host}"
          : "${LOCATION:?Missing LOCATION secret}"
          : "${EUREKA_ADDRESS:?Missing EUREKA_ADDRESS secret}"
          : "${EUREKA_PORT:?Missing EUREKA_PORT secret}"
          : "${KEYSTORE_ALIAS:?Missing keystore alias}"
          : "${KEYSTORE_PASSWORD:?Missing keystore password}"
          : "${KEYSTORE_TYPE:?Missing keystore type}"
          
          SSH_PORT="${SSH_PORT:-22}"
          
          SERVER="${SERVER_USER}@${SERVER_HOST}"
          
          # Normalize LOCATION so both "opt/java-webservices"
          # and "/opt/java-webservices" work.
          LOCATION="${LOCATION#/}"
          APP_DIR="/${LOCATION}"
          
          JAR_NAME="api-gateway-service.jar"
          SERVICE_NAME="apigateway"
          REMOTE_JAR="${APP_DIR}/${JAR_NAME}"
          REMOTE_ENV="${APP_DIR}/.env.apigateway"
          
          SSH_OPTS=(
            -o StrictHostKeyChecking=no
            -o ConnectTimeout=20
            -p "$SSH_PORT"
          )
          
          SSH_CMD="ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p ${SSH_PORT}"
          
          echo "Preparing deployment for ${SERVICE_NAME}..."
          echo "Target directory: ${APP_DIR}"
          echo "Spring profile: ${APP_PROFILE}"
          
          # Create the remote directory.
          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "mkdir -p '$APP_DIR'"
          
          # Create the systemd unit only if it does not already exist.
          # Existing service configuration will be preserved.
          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "sudo bash -s -- '$SERVER_USER' '$APP_DIR' '$APP_PROFILE'" <<'REMOTE'
          set -euo pipefail
          
          APP_USER="$1"
          APP_DIR="$2"
          APP_PROFILE="$3"
          
          SERVICE_FILE="/etc/systemd/system/apigateway.service"
          
          if ! sudo systemctl cat apigateway >/dev/null 2>&1; then
            echo "Creating systemd service..."
          
            JAVA_BIN="$(command -v java)"
          
            if [ -z "$JAVA_BIN" ]; then
              echo "Java was not found on the server."
              exit 1
            fi
          
            sudo tee "$SERVICE_FILE" >/dev/null <<UNIT
          [Unit]
          Description=API Gateway Spring Boot Application
          Wants=network-online.target
          After=network-online.target
          
          [Service]
          Type=simple
          User=$APP_USER
          WorkingDirectory=$APP_DIR
          EnvironmentFile=-$APP_DIR/.env.apigateway
          ExecStart=$JAVA_BIN -Dspring.profiles.active=$APP_PROFILE -jar $APP_DIR/api-gateway-service.jar
          Restart=on-failure
          RestartSec=10
          SuccessExitStatus=143
          TimeoutStopSec=30
          
          [Install]
          WantedBy=multi-user.target
          UNIT
          
            sudo systemctl daemon-reload
          else
            echo "Existing systemd unit found; preserving its configuration."
          fi
          
          sudo systemctl enable apigateway
          
          echo "Stopping API Gateway before deployment..."
          sudo systemctl stop apigateway
          REMOTE
          
          # Create the environment file locally with systemd-compatible
          # double-quoted values. Do not print secret values in the logs.
          ENV_TMP="$(mktemp)"
          trap 'rm -f "$ENV_TMP"' EXIT
          
          export ENV_TMP
          
          python3 <<'PY'
          import os
          
          def systemd_quote(value):
              if "\n" in value or "\r" in value:
                  raise ValueError("Environment values must not contain newlines")
              return '"' + value.replace("\\", "\\\\").replace('"', '\\"') + '"'
          
          values = {
              "EUREKA_ADDRESS": os.environ["EUREKA_ADDRESS"],
              "EUREKA_PORT": os.environ["EUREKA_PORT"],
              "LOCATION": os.environ["LOCATION"],
              "ENV": os.environ.get("ENV_FILE", ""),
              "KEYSTORE_ALIAS": os.environ["KEYSTORE_ALIAS"],
              "KEYSTORE_PASSWORD": os.environ["KEYSTORE_PASSWORD"],
              "KEYSTORE_TYPE": os.environ["KEYSTORE_TYPE"],
          }
          
          with open(os.environ["ENV_TMP"], "w", encoding="utf-8", newline="\n") as f:
              for key, value in values.items():
                  f.write(f"{key}={systemd_quote(value)}\n")
          PY
          
          echo "Uploading application JAR..."
          rsync -az \
            -e "$SSH_CMD" \
            "$JAR_FILE" \
            "${SERVER}:${REMOTE_JAR}"
          
          echo "Uploading environment file..."
          rsync -az \
            -e "$SSH_CMD" \
            "$ENV_TMP" \
            "${SERVER}:${REMOTE_ENV}"
          
          echo "Setting environment file permissions..."
          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "chmod 600 '$REMOTE_ENV'"
          
          # Stop any legacy nohup process left behind by the old workflow.
          # Match the exact JAR path and request graceful termination.
          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "bash -s -- '$REMOTE_JAR'" <<'REMOTE'
          set -euo pipefail
          
          APP_JAR="$1"
          
          mapfile -t PIDS < <(
            ps -eo pid=,args= |
              awk -v jar="$APP_JAR" '
                index($0, jar) > 0 && /java/ { print $1 }
              '
          )
          
          for PID in "${PIDS[@]}"; do
            if [ "$PID" != "$$" ]; then
              echo "Stopping legacy Java process PID $PID..."
              kill -TERM "$PID" 2>/dev/null || true
            fi
          done
          
          for attempt in $(seq 1 15); do
            STILL_RUNNING=0
          
            for PID in "${PIDS[@]}"; do
              if kill -0 "$PID" 2>/dev/null; then
                STILL_RUNNING=1
              fi
            done
          
            if [ "$STILL_RUNNING" -eq 0 ]; then
              break
            fi
          
            sleep 1
          done
          
          for PID in "${PIDS[@]}"; do
            if kill -0 "$PID" 2>/dev/null; then
              echo "Legacy process $PID did not stop gracefully."
              exit 1
            fi
          done
          REMOTE
          
          echo "Starting API Gateway with systemd..."
          
          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "sudo systemctl start apigateway"
          
          echo "Waiting for API Gateway to become active..."
          
          if ! ssh "${SSH_OPTS[@]}" "$SERVER" \
            "for i in \$(seq 1 60); do
               if sudo systemctl is-active --quiet apigateway; then
                 sudo systemctl status apigateway --no-pager
                 exit 0
               fi
               sleep 1
             done
             exit 1"; then
          
            echo "API Gateway failed to become active."
            ssh "${SSH_OPTS[@]}" "$SERVER" \
              "sudo systemctl status apigateway --no-pager || true;
               sudo journalctl -u apigateway -n 100 --no-pager || true"
            exit 1
          fi
          
          echo "Checking boot-time enablement..."
          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "sudo systemctl is-enabled apigateway"
          
          echo "API Gateway deployment completed successfully."
          

  deploy-alfuttaim:

    if: github.ref == 'refs/heads/alfuttaim'

    runs-on: ubuntu-latest

    env:
      APP_NAME: api-gateway-service
      SERVICE_NAME: api-gateway-service
      DEPLOY_DIR: 'C:\${{ secrets.WIN_LOCATION }}'
      JAR_NAME: api-gateway-service.jar

    steps:
      #######################################################
      # Checkout Repository
      #######################################################
      - name: Checkout Repository
        uses: actions/checkout@v4

      #######################################################
      # Setup Java
      #######################################################
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ==========================
      # Build
      # ==========================
      - name: Build Application
        run: mvn clean package -DskipTests

      #######################################################
      # Locate JAR
      #######################################################
      - name: Locate Executable JAR
        shell: bash
        run: |

          JAR=$(find . \
            -type f \
            -path "*/target/*.jar" \
            ! -name "*sources.jar" \
            ! -name "*javadoc.jar" \
            ! -name "*original*.jar" \
            | head -n1)

          if [ -z "$JAR" ]; then
            echo "Executable jar not found."
            exit 1
          fi

          echo "Found: $JAR"

          cp "$JAR" app.jar

      #######################################################
      # Generate WinSW XML
      #######################################################
      - name: Generate WinSW XML
        shell: bash
        run: |
          cp deployment/api-gateway-service.xml.template api-gateway-service.xml
          
          sed -i "s|\${EUREKA_ADDRESS}|${{ secrets.EUREKA_ADDRESS }}|g" api-gateway-service.xml
          sed -i "s|\${EUREKA_PORT}|${{ secrets.EUREKA_PORT }}|g" api-gateway-service.xml
          sed -i "s|\${WIN_LOCATION}|C:/${{secrets.WIN_LOCATION}}|g" api-gateway-service.xml
          sed -i "s|\${KEYSTORE_ALIAS}|${{ secrets.KEYSTORE_ALIAS }}|g" api-gateway-service.xml
          sed -i "s|\${KEYSTORE_PASSWORD}|${{ secrets.KEYSTORE_PASSWORD }}|g" api-gateway-service.xml
          sed -i "s|\${KEYSTORE_TYPE}|${{ secrets.KEYSTORE_TYPE }}|g" api-gateway-service.xml
          
          echo "Generated WinSW XML:"
          
#          cat api-gateway-service.xml

      #######################################################
      # Configure SSH
      #######################################################
      - name: Configure SSH
        shell: bash
        run: |

          mkdir -p ~/.ssh

          echo "${{ secrets.WINDOW_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan ${{ secrets.WINDOW_SERVER_HOST }} >> ~/.ssh/known_hosts
          
      #######################################################
      # Create Deployment Directory
      #######################################################
      - name: Create Deployment Directory
        run: |
          ssh \
          -i ~/.ssh/id_rsa \
          -o StrictHostKeyChecking=no \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
          "powershell -NoProfile -NonInteractive -" <<'EOF'
          
          $ErrorActionPreference = 'Stop'
          
          New-Item `
          -ItemType Directory `
          -Force `
          -Path 'C:/${{ secrets.WIN_LOCATION }}' | Out-Null
          
          New-Item `
          -ItemType Directory `
          -Force `
          -Path 'C:/${{ secrets.WIN_LOCATION }}/logs' | Out-Null
          
          Write-Host "Deployment directory ready."
          
          EOF

      #######################################################
      # Upload WinSW Wrapper
      #######################################################
      - name: Upload WinSW Wrapper
        run: |
          
          ssh \
          -i ~/.ssh/id_rsa \
          -o StrictHostKeyChecking=no \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
          "powershell -NoProfile -NonInteractive -" <<'EOF'
          
          if (Test-Path 'C:/${{ secrets.WIN_LOCATION }}/api-gateway-service.exe') {
          
           Write-Host "WinSW wrapper already exists."
           Write-Host "Skipping wrapper upload."
          
           exit 0
          }
          
          Write-Host "WinSW wrapper does not exist."
          Write-Host "Wrapper will be uploaded."
          
          EOF
          
          WRAPPER_EXISTS=$(ssh \
          -i ~/.ssh/id_rsa \
          -o StrictHostKeyChecking=no \
          ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
          "powershell -NoProfile -NonInteractive -Command \"if (Test-Path 'C:/${{ secrets.WIN_LOCATION }}/api-gateway-service.exe') { exit 0 } else { exit 1 }\"" \
          >/dev/null 2>&1 && echo "yes" || echo "no")
          
          if [ "$WRAPPER_EXISTS" = "no" ]; then

          echo "Uploading api-gateway-service.exe..."

          scp \
           -i ~/.ssh/id_rsa \
           -o StrictHostKeyChecking=no \
           -o ServerAliveInterval=30 \
           -o ServerAliveCountMax=10 \
           deployment/api-gateway-service.exe \
           "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}:/C:/${{ secrets.WIN_LOCATION }}/api-gateway-service.exe"
          
          else

          echo "api-gateway-service.exe already exists. Upload skipped."
          
          fi

      #######################################################
      # Stop WinSW Service
      #######################################################
      - name: Stop Windows Service
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'

          $ErrorActionPreference = 'Stop'

          $service = Get-Service -Name 'api-gateway-service' -ErrorAction Stop
          
          if ($null -eq $service) {

            Write-Host "api-gateway-service does not exist yet."
            Write-Host "Skipping stop. Service will be installed later."

            exit 0
          }

          Write-Host "Current Status: $($service.Status)"

          if ($service.Status -eq 'Running') {

              Write-Host "Stopping service..."

              Stop-Service -Name 'api-gateway-service'

              $service.WaitForStatus(
                  'Stopped',
                  '00:00:30'
              )

          }

          $service = Get-Service -Name 'api-gateway-service'

          if ($service.Status -ne 'Stopped') {

              throw "Failed to stop service."

          }

          Write-Host "Service stopped successfully."

          EOF

      #######################################################
      # Backup Existing JAR
      #######################################################
      - name: Backup Existing JAR
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'

          $ErrorActionPreference='Stop'

          $jar="C:/${{ secrets.WIN_LOCATION }}/api-gateway-service.jar"

          $backup="C:/${{ secrets.WIN_LOCATION }}/api-gateway-service.jar.bak"

          if(Test-Path $jar){

              Copy-Item `
                  $jar `
                  $backup `
                  -Force

              Write-Host "Backup completed."

          }
          else{

              Write-Host "No existing JAR. Backup skipped."

          }

          EOF

      #######################################################
      # Upload New JAR
      #######################################################
      - name: Upload Application
        run: |

          scp \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            app.jar \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}:/C:/${{ secrets.WIN_LOCATION }}/api-gateway-service.jar"

      #######################################################
      # Upload WinSW XML
      #######################################################
      - name: Upload WinSW XML
        run: |
          scp \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            api-gateway-service.xml \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}:/C:/${{ secrets.WIN_LOCATION }}/api-gateway-service.xml"

      #######################################################
      # Install WinSW Service If Missing
      #######################################################
      - name: Install WinSW Service If Missing
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'
          
          $ErrorActionPreference = 'Stop'
          
          $serviceName = 'api-gateway-service'
          
          $base = 'C:/${{ secrets.WIN_LOCATION }}'
          
          $wrapper = "$base/api-gateway-service.exe"
          
          $config = "$base/api-gateway-service.xml"
          
          $service = Get-Service `
            -Name $serviceName `
            -ErrorAction SilentlyContinue
          
          if ($null -eq $service) {
          
              Write-Host ""
              Write-Host "============================================"
              Write-Host "Installing WinSW Service"
              Write-Host "============================================"
          
              if (!(Test-Path -LiteralPath $wrapper -PathType Leaf)) {
                  throw "WinSW wrapper not found: $wrapper"
              }
          
              if (!(Test-Path -LiteralPath $config -PathType Leaf)) {
                  throw "WinSW configuration not found: $config"
              }
          
              Write-Host "Wrapper: $wrapper"
              Write-Host "Config:  $config"
          
              Push-Location $base
          
              try {
          
                  & $wrapper install
          
                  if ($LASTEXITCODE -ne 0) {
                      throw "WinSW service installation failed."
                  }
          
              }
              finally {
          
                  Pop-Location
              }
          
              Write-Host "WinSW service installed successfully."
          
          }
          else {
          
              Write-Host ""
              Write-Host "api-gateway-service already exists."
              Write-Host "Skipping WinSW installation."
          
          }
          
          EOF
      

      #######################################################
      # Verify Uploaded Files
      #######################################################
      - name: Verify Upload
        run: |
          ssh \
          -i ~/.ssh/id_rsa \
          -o StrictHostKeyChecking=no \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
          "powershell -NoProfile -NonInteractive -" <<'EOF'
          
          $files = @(
           'C:/${{ secrets.WIN_LOCATION }}/api-gateway-service.exe',
           'C:/${{ secrets.WIN_LOCATION }}/api-gateway-service.jar',
           'C:/${{ secrets.WIN_LOCATION }}/api-gateway-service.xml'
          )
          
          foreach($file in $files){
          
           if(!(Test-Path $file)){
               throw "Missing: $file"
           }
          
           Write-Host "Verified: $file"
          
          }
          
          Get-ChildItem C:\${{ secrets.WIN_LOCATION }}
          
          EOF


      #######################################################
      # Start Windows Service
      #######################################################
      - name: Start Windows Service
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'

          $ErrorActionPreference='Stop'

          Write-Host "Starting api-gateway-service..."

          Start-Service -Name "api-gateway-service"

          Start-Sleep -Seconds 5

          $service = Get-Service -Name "api-gateway-service"

          $service.WaitForStatus(
              "Running",
              "00:00:30"
          )

          $service = Get-Service -Name "api-gateway-service"

          if($service.Status -ne "Running"){

              throw "Service failed to start."

          }

          Write-Host "Service started successfully."

          EOF

      #######################################################
      # Verify Java Process
      #######################################################
      - name: Verify Java Process
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'

          $ErrorActionPreference='Stop'

          $java = Get-CimInstance Win32_Process |
          Where-Object {

              $_.Name -eq "java.exe" -and
              $_.CommandLine -like "*api-gateway-service.jar*"

          }

          if(!$java){

              throw "Java process not running."

          }

          Write-Host "Java PID: $($java.ProcessId)"

          EOF

      #######################################################
      # Verify Deployment
      #######################################################
      - name: Verify Deployment
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            powershell -Command "

            Write-Host ''

            Write-Host '========== SERVICE =========='

            Get-Service api-gateway-service

            Write-Host ''

            Write-Host '========== FILES =========='

            Get-ChildItem C:\momas\api_gateway

            Write-Host ''

            Write-Host '========== LOGS =========='

            Get-ChildItem C:/${{ secrets.WIN_LOCATION }}/logs -ErrorAction SilentlyContinue

            "
      #######################################################
      # Display Logs On Failure
      #######################################################
      - name: Display Logs
        if: failure()
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            powershell -Command "

            Write-Host ''
            Write-Host '========== WinSW OUT =========='

            if(Test-Path 'C:/${{ secrets.WIN_LOCATION }}/api-gateway-service.out.log'){
                Get-Content 'C:/${{ secrets.WIN_LOCATION }}/api-gateway-service.out.log' -Tail 100
            }

            Write-Host ''
            Write-Host '========== WinSW ERR =========='

            if(Test-Path 'C:/${{ secrets.WIN_LOCATION }}/api-gateway-service.err.log'){
                Get-Content 'C:/${{ secrets.WIN_LOCATION }}/api-gateway-service.err.log' -Tail 100
            }

            Write-Host ''
            Write-Host '========== WRAPPER LOG =========='

            if(Test-Path 'C:/${{ secrets.WIN_LOCATION }}/wrapper.log'){
                Get-Content 'C:/${{ secrets.WIN_LOCATION }}/wrapper.log' -Tail 100
            }

            Write-Host ''
            Write-Host '========== SPRING LOG =========='

            if(Test-Path 'C:/${{ secrets.WIN_LOCATION }}/logs/apigateway.log'){
                Get-Content 'C:/${{ secrets.WIN_LOCATION }}/logs/apigateway.log' -Tail 100
            }

            Write-Host ''
            Write-Host '========== GC LOG =========='

            if(Test-Path 'C:/${{ secrets.WIN_LOCATION }}/logs/gc.log'){
                Get-Content 'C:/${{ secrets.WIN_LOCATION }}/logs/gc.log' -Tail 100
            }

            "
          
          

